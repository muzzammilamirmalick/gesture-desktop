name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows, because pyautogui needs a desktop to import and Linux runners have none.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The tests use sample landmark data, so no webcam or models are needed.
      - name: Test
        run: python -m pytest
